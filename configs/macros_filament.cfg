[gcode_macro LOAD_FILAMENT]
variable_load_distance: 175         # Distance to load filament into the extruder
variable_pre_load_distance: 150      # Initial distance to pull filament before heating up, will be subtracted from load_distance
variable_purge_distance: 50        # Distance to purge filament after loading
variable_nozzle_preheat_temp: 230  # Default preheat temperature for the nozzle
variable_turn_off_extruder: True   # Option to turn off the extruder after loading (True/False)
gcode:
    # Check if filament sensor detects filament
    {% if printer['filament_switch_sensor my_sensor'].filament_detected == False %}
        RESPOND TYPE=error MSG="Error: No filament detected by sensor! Please insert filament before loading."
        M117 No filament detected!
        # Exit macro without loading
    {% else %}
        # Parameters and settings
        {% set load_speed = params.LOAD_SPEED|default(600)|int %}  # Speed in mm/min for fast filament loading
        {% set purge_speed = params.PURGE_SPEED|default(300)|int %}  # Speed in mm/min for purging filament
        {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp)|int %}  # Target temperature for the nozzle
        {% set min_temp = params.MIN_TEMP|default(180)|int %}  # Minimum safe temperature for extrusion
        {% set pre_load_distance = pre_load_distance|int %}  # Pre-load distance before heating

        # Save current state of the printer
        SAVE_GCODE_STATE NAME=load_state
        G1 E{pre_load_distance} F{load_speed} ; Load filament at the specified loading speed

        # Heat directly to the target temperature if it's above the minimum temperature
        {% if target_temp >= min_temp %}
            M104 S{target_temp} ; Set extruder to target temperature
            M109 S{target_temp} ; Wait for extruder to reach target temperature
        {% else %}
            # Heat to minimum temperature first if target is too low
            M104 S{min_temp} ; Set extruder to safe minimum temperature
            M109 S{min_temp} ; Wait for extruder to reach safe minimum temperature
        {% endif %}

        # Begin filament loading process
        G91 ; Set relative positioning for extrusion
        G92 E0 ; Reset extruder position
        G1 E{load_distance - pre_load_distance} F{load_speed} ; Load filament at the specified loading speed
        G1 E{purge_distance} F{purge_speed} ; Purge filament at the slower purging speed

        # Optionally turn off the extruder heater after loading
        {% if turn_off_extruder %}
                M400
                M104 S0 ; Turn off extruder heater
        {% endif %}

        # Restore previous state of the printer
        G90 ; Restore absolute positioning
        RESTORE_GCODE_STATE NAME=load_state

        # Completion message
        M117 Filament load complete
    {% endif %}


[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance: 120      # Distance to retract filament from the extruder
variable_nozzle_preheat_temp: 230  # Default preheat temperature for unloading
variable_turn_off_extruder: True   # Option to turn off the extruder after unloading (True/False)
variable_purge_distance: 30        # Distance to purge filament before unloading
variable_purge_speed: 700          # Speed in mm/min for purging filament before unloading
variable_hot_unload_distance: 100   # Remove the filamet from the hot zone
variable_cooldown_time: 80         # Time to cool down filamet before complete unload

gcode:
    # Check if filament sensor detects filament (should be present to unload)
    {% if printer['filament_switch_sensor my_sensor'].filament_detected == False %}
        RESPOND TYPE=error MSG="Warning: No filament detected by sensor. Cannot unload non-existent filament."
        M117 No filament to unload!
        # Exit macro without unloading
    {% else %}
        # Parameters and settings
        {% set retract_speed = params.RETRACT_SPEED|default(800)|int %}  # Speed for retracting filament
        {% set target_temp = params.TARGET_TEMP|default(nozzle_preheat_temp)|int %}  # Target temperature for the nozzle
        {% set min_temp = params.MIN_TEMP|default(180)|int %}  # Minimum safe temperature for extrusion
        {% set unload_distance = unload_distance|int %}  # Distance to retract filament
        {% set purge_distance = purge_distance|int %}  # Distance to purge filament before unloading
        {% set purge_speed = purge_speed|int %}  # Speed for purging filament before unloading
        {% set hot_unload_distance = hot_unload_distance|int %}  # Distance to remove filament from hot zone
        {% set cooldown_time = cooldown_time|int %}  # Time to cool down filament before complete unload

        # Save current state of the printer
        SAVE_GCODE_STATE NAME=unload_state

        # Heat the nozzle to the target temperature if required
        {% if printer.extruder.temperature < target_temp %}
            # Ensure the nozzle is heated to the target temperature or at least the minimum safe temperature
            {% if target_temp >= min_temp %}
                M104 S{target_temp} ; Set extruder to target temperature
                M109 S{target_temp} ; Wait for extruder to reach target temperature
            {% else %}
                M104 S{min_temp} ; Set extruder to safe minimum temperature
                M109 S{min_temp} ; Wait for extruder to reach safe minimum temperature
            {% endif %}
        {% endif %}

        # Begin filament unloading process
        G91 ; Set relative positioning for extrusion
        G92 E0 ; Reset extruder position
        G1 E{purge_distance} F{purge_speed} ; Purge filament before unloading
        G1 E-{hot_unload_distance} F{retract_speed} ; Retract filament from hot zone
        G4 P{cooldown_time*1000} ; Wait for filament to cool down in milliseconds
        G1 E-{unload_distance} F{retract_speed} ; Retract filament at the specified speed

        # Optionally turn off the extruder heater after unloading
        {% if turn_off_extruder %}
            M104 S0 ; Turn off extruder heater
        {% endif %}

        # Restore previous state of the printer
        G90 ; Restore absolute positioning
        RESTORE_GCODE_STATE NAME=unload_state

        # Completion message
        M117 Filament unload complete
    {% endif %}


#######################################
# Filament Detection Notification
#######################################

[gcode_macro FILAMENT_DETECTED_NOTIFICATION]
description: Show popup notification when filament is detected
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin Filament Detected"
    RESPOND TYPE=command MSG="action:prompt_text Filament has been inserted!"
    RESPOND TYPE=command MSG="action:prompt_text "
    RESPOND TYPE=command MSG="action:prompt_text Select material to load:"
    RESPOND TYPE=command MSG="action:prompt_button Load PLA (210°C)|LOAD_PLA; RESPOND TYPE=command MSG=action:prompt_end|success"
    RESPOND TYPE=command MSG="action:prompt_button Load PETG (240°C)|LOAD_PETG; RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_button Load ABS (250°C)|LOAD_ABS; RESPOND TYPE=command MSG=action:prompt_end|warning"
    RESPOND TYPE=command MSG="action:prompt_button More Options...|RESPOND TYPE=command MSG=action:prompt_end|secondary"
    RESPOND TYPE=command MSG="action:prompt_button Cancel|RESPOND TYPE=command MSG=action:prompt_end|error"
    RESPOND TYPE=command MSG="action:prompt_show"
    M117 Filament detected! Select material


#######################################
# Material Preset Macros
#######################################

[gcode_macro LOAD_PLA]
description: Load PLA filament at 210°C
gcode:
    
    LOAD_FILAMENT TARGET_TEMP=210

[gcode_macro LOAD_PETG]
description: Load PETG filament at 240°C
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    LOAD_FILAMENT TARGET_TEMP=240

[gcode_macro LOAD_ABS]
description: Load ABS filament at 250°C
gcode:
    RESPOND TYPE=command MSG="action:prompt_end"
    LOAD_FILAMENT TARGET_TEMP=250

[gcode_macro UNLOAD_PLA]
description: Unload PLA filament at 210°C
gcode:
    UNLOAD_FILAMENT TARGET_TEMP=210

[gcode_macro UNLOAD_PETG]
description: Unload PETG filament at 240°C
gcode:
    UNLOAD_FILAMENT TARGET_TEMP=240

[gcode_macro UNLOAD_ABS]
description: Unload ABS filament at 250°C
gcode:
    UNLOAD_FILAMENT TARGET_TEMP=250
#######################################
