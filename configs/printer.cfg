[include fluidd.cfg]
[include macros_filament.cfg]
[virtual_sdcard]
path: /home/tami/printer_data/gcodes
on_error_gcode: CANCEL_PRINT


# This file contains common pin mappings for the BIGTREETECH SKR V1.4
# board. To use this config, the firmware should be compiled for the
# LPC1768 or LPC1769(Turbo).

# See docs/Config_Reference.md for a description of parameters.

[stepper_a]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 256
rotation_distance: 40
endstop_pin: tmc2209_stepper_a:virtual_endstop
homing_retract_dist: 0
homing_speed: 50
#arm_length: 270.0
#position_endstop: 280

[stepper_b]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 256
rotation_distance: 40
endstop_pin: tmc2209_stepper_b:virtual_endstop
homing_retract_dist: 0
homing_speed: 50
#position_endstop: 280

[stepper_c]
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
microsteps: 256
rotation_distance: 40
endstop_pin: tmc2209_stepper_c:virtual_endstop
homing_retract_dist: 0 
#position_endstop: 280

[extruder]
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
microsteps: 16
rotation_distance: 43.6
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.5
sensor_type: PT1000
sensor_pin: P0.23
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 260
min_extrude_temp: 0
gear_ratio: 6.25:1
max_extrude_only_distance: 300.0

[filament_switch_sensor my_sensor]
pause_on_runout: True
#   When set to True, a PAUSE will execute immediately after a runout
#   is detected. Note that if pause_on_runout is False and the
#   runout_gcode is omitted then runout detection is disabled. Default
#   is True.
#runout_gcode:
#   A list of G-Code commands to execute after a filament runout is
#   detected. See docs/Command_Templates.md for G-Code format. If
#   pause_on_runout is set to True this G-Code will run after the
#   PAUSE is complete. The default is not to run any G-Code commands.
insert_gcode:
        FILAMENT_DETECTED_NOTIFICATION
#   A list of G-Code commands to execute after a filament insert is
#   detected. See docs/Command_Templates.md for G-Code format. The
#   default is not to run any G-Code commands, which disables insert
#   detection.
event_delay: 3.0
#   The minimum amount of time in seconds to delay between events.
#   Events triggered during this time period will be silently
#   ignored. The default is 3 seconds.
#pause_delay: 0.5
#   The amount of time to delay, in seconds, between the pause command
#   dispatch and execution of the runout_gcode. It may be useful to
#   increase this delay if OctoPrint exhibits strange pause behavior.
#   Default is 0.5 seconds.
#debounce_delay:
#   A period of time in seconds to debounce events prior to running the
#   switch gcode. The switch must he held in a single state for at least
#   this long to activate. If the switch is toggled on/off during this delay,
#   the event is ignored. Default is 0.
switch_pin: !P1.26
#   The pin on which the switch is connected. This parameter must be
#   provided.

#[extruder1]
#step_pin: P1.15
#dir_pin: P1.14
#enable_pin: !P1.16
#heater_pin: P2.4
#sensor_pin: P0.23
#...

[heater_bed]
heater_pin: P2.4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 100

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_06300001E9A438AF7523EF5BC02000F5-if00

[printer]
kinematics: delta
max_velocity: 1000
max_accel: 10000
max_z_velocity: 150
#delta_radius: 145
print_radius: 100
minimum_z_position: -2


[delta_calibrate]
radius: 100

[tmc2209 stepper_a]
uart_pin: P1.10
run_current: 1.200
diag_pin: P1.29
driver_SGTHRS: 90
#stealthchop_threshold: 999999

[tmc2209 stepper_b]
uart_pin: P1.9
run_current: 1.200
diag_pin: P1.28
driver_SGTHRS: 90
#stealthchop_threshold: 999999

[tmc2209 stepper_c]
uart_pin: P1.8
run_current: 1.200
diag_pin: P1.27
driver_SGTHRS: 90
#stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: P1.4
run_current: 0.6
#stealthchop_threshold: 999999

#[tmc2208 extruder1]
#uart_pin: P1.1
#run_current: 0.800
#stealthchop_threshold: 999999

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp0"

[display]
lcd_type: st7920
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8

[output_pin beeper]
pin: EXP1_1


[gcode_macro END_PRINT]
gcode:
# Retract 
        G92 E1
        G1 E-2 F300
 # Turn off bed, extruder, and fan
        M140 S0
        M104 S0
        M106 S0
# Go home
        G0 X0 Y0 Z270
        M18 S180 ;disable motors after 180s


[gcode_macro CANCEL_PRINT]
gcode:
# Turn off bed, extruder, and fan
        M140 S0
        M104 S0
        M106 S0
# Go home
        
        G0 X0 Y0 Z270
        M18 S180 ;disable motors after 180s


[gcode_macro START_PRINT]
gcode:
    # -------------------------------------------------
    # 1️⃣ Home all axes
    # -------------------------------------------------
        {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
        {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
        # --- Your custom start G-code goes here ---
        M140 S{BED_TEMP}  # Start heating the bed (non-blocking)
        M104 S150 # Start heating the extruder to thermal expansion
        G28 # Home all axes
        M190 S{BED_TEMP} # Wait for bed to reach temperature
        M109 S150 # Wait for extruder to reach expansion temperature
        # Use absolute coordinates
        G90

        G0 X0 Y0 Z2 F3000

        # -------------------------------------------------
        # Perform Z‑probe
        PROBE                  ; probe down until trigger
        # The probe returns the Z position where it triggered.

         #  Set the Z‑offset to the measured value

        #SET_GCODE_OFFSET Z={printer.probe.last_z_result}
        BED_MESH_CALIBRATE
        G0 X-99 Y0 Z1
        M109 S{EXTRUDER_TEMP} # Wait for extruder to reach temperature

